
name: Upload and Download Artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  upload-job:
    runs-on: ubuntu-latest

    steps:
      - name: Create text file
        run: |
          echo "Hello! This file is uploaded as an artifact." > message.txt
          echo "GitHub Actions Artifact Demo" >> message.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-text-file
          path: message.txt

  download-job:
    runs-on: ubuntu-latest
    needs: upload-job

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-text-file

      - name: Print file contents
        run: |
          echo "Downloaded file content:"
          cat message.txt
